

services:
  app:
    build: .
    image: auau-app
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - data:/app/data

    depends_on:
      postgres:
        condition: service_healthy
      pocket-id:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

    extra_hosts:
      - "localhost:host-gateway"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auau}
      POSTGRES_DB: ${POSTGRES_DB:-auau}
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auau} -d ${POSTGRES_DB:-auau}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  pocket-id:

    image: ghcr.io/pocket-id/pocket-id:latest
    ports:
      - "14111:1411"
    environment:
      APP_URL: ${POCKET_ID_APP_URL:-http://localhost:14111}

      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:-please-change-me-0123456789abcdef}
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  data:
  pgdata:
  pocket-id-data:
